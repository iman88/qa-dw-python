[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-dq"
version = "0.1.0"
description = "Data and AI test automation for a clinical R&D warehouse: CDC dedup, full history, partitioned star schema, reconciliation, Playwright API tests in Gherkin, GenAI evaluation."
requires-python = ">=3.15,<3.16"  # tested on 3.15.2 (see .python-version)
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ionut Man" }]
# Exact versions on purpose: nothing updates unless someone changes it here and in constraints.txt.
dependencies = [
  "sqlalchemy==2.1.8",
  "psycopg[binary]==3.3.9",
  "faker==40.54.0",
  "fastapi==0.162.5",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "anthropic==2.8.0",
  "jinja2==3.1.6",
  "sqlglot==30.31.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.2.0",
  "pytest-bdd==9.0.1",
  "playwright==1.65.1",
  "allure-pytest-bdd==2.16.2",
  "httpx2==2.16.0",
  "hypothesis==6.170.15",
  "pytest-xdist==3.8.0",
]
dev = ["ruff==0.17.5", "sqlfluff==4.5.0", "mypy==2.4.1"]

[project.scripts]
clinical-dq = "clinical_dq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinical_dq = ["reporting/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
bdd_features_base_dir = "tests/features"
addopts = "-ra --strict-markers --cucumberjson=reports/cucumber.json"
markers = [
  "all: every feature",
  "data: the seeded test data, with exact figures",
  "schema: schema contracts per layer",
  "recon: source-to-target reconciliation",
  "history: full history and deduplicated latest layers",
  "star: dimensions, facts and reporting views",
  "partition: date partition plan, routing and pruning",
  "warehouse: safety figures, warehouse vs source system",
  "mutation: injected defects that the checks must catch",
  "genai: GenAI narrative service (Playwright API) and evaluation, offline",
  "pushdown: checksum reconciliation computed in the database",
  "edge: hand-built change feed edge cases",
  "monitoring: production monitoring runs, stored results and alerts",
  "compliance: personal data, access control, traceability and evidence",
  "genai_scale: GenAI evaluation set, stored runs, regression statistics, judge calibration",
  "genai_live: calls Claude for real; runs only with GENAI_PROVIDER=claude",
  "incremental: incremental loads equal a full build",
  "property: property-based tests on random change feeds",
  "quality: tests of the test tooling (selection, flaky-test tracking)",
  "unit: pure Python tests, no database",
]

[tool.ruff]
line-length = 110
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long SQL strings read better unwrapped; the formatter keeps code at 110

[tool.mypy]
python_version = "3.15"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
